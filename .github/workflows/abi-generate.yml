name: Generate Contract ABIs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  generate-abis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli --version 27.1.0

      - name: Build WASM artifacts
        run: stellar contract build

      - name: Extract ABI JSON schemas
        run: |
          chmod +x scripts/generate-abis.sh
          ./scripts/generate-abis.sh

      - name: Upload ABI schemas
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f4aef607fa # v4.6.2
        with:
          name: contract-abis
          path: deployments/abi/*.abi.json
