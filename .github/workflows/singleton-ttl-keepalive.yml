name: Singleton TTL keepalive

on:
  pull_request:
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate TTL targets and script syntax
        run: |
          jq -e '
            (.contract_ids | type == "array" and length > 0 and all(.[]; test("^C[A-Z2-7]{55}$"))) and
            (.wasm_hashes | type == "array" and length > 0 and all(.[]; test("^[0-9a-f]{64}$")))
          ' deployments/ttl-targets.json
          bash -n scripts/keepalive_singletons.sh

  keepalive:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@8e402ea28202950b272fbabc34caad4d2f64fe87 # v27.1.0
        with:
          version: "27.1.0"

      - name: Extend singleton contract and code TTLs
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_SECRET_KEY }}
        run: bash scripts/keepalive_singletons.sh
